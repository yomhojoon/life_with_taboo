<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
  <meta name="theme-color" content="#050606">
  <meta name="description" content="그가 오고 있습니다. 150초의 제한 시간. 모니터에 명령을 입력하라.">
  <title>그가 오고 있습니다</title>
  <style>
:root{color-scheme:dark;--bg:#050606;--ink:#c9d1ce;--mute:#707b77;--dim:#46514d;--warn:#e2b58a;--bright:#e4efe9;--line:#2a342f;--red:#b7766e;--mono:"D2Coding","Consolas","Noto Sans Mono CJK KR","Malgun Gothic",monospace}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{min-height:100dvh;background:#010202;color:var(--ink);font-family:var(--mono);display:grid;place-items:center;padding:clamp(10px,3vw,32px)}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:1px solid var(--bright);outline-offset:4px}
.monitor{position:relative;isolation:isolate;width:min(1060px,100%);height:min(760px,calc(100dvh - 22px));min-height:450px;background:radial-gradient(ellipse at 50% 33%,#0d1210 0%,#070a09 63%,#040605 100%);border:1px solid #323b36;box-shadow:0 0 0 5px #0b0e0c,0 0 0 7px #171d19,0 25px 90px #000;overflow:hidden}
.screen-glass{pointer-events:none;z-index:4;position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0,transparent 3px,rgba(0,0,0,.115) 4px);opacity:.5}
.screen-glass:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.47) 100%)}
.hidden{display:none!important}
.intro{height:100%;padding:clamp(24px,6vw,72px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;position:relative;z-index:1}
.prelude{font-size:11px;letter-spacing:.15em;color:var(--mute)}
h1{font-size:clamp(31px,6vw,68px);line-height:1.18;font-weight:500;letter-spacing:-.07em;color:var(--bright);margin:clamp(25px,4.8vh,43px) 0 15px;text-shadow:0 0 30px #61736836}.period{color:var(--warn)}
.tagline{font-size:clamp(13px,2vw,17px);color:var(--warn);margin:0 0 clamp(22px,6vh,60px)}
.intro-rule{max-width:750px;border-left:1px solid var(--line);padding-left:18px;display:grid;gap:14px}
.intro-rule p{display:flex;gap:13px;align-items:baseline;font-size:clamp(12px,1.35vw,14px);line-height:1.7;margin:0;color:#aab5ae}.index{color:var(--mute);font-size:10px;letter-spacing:.06em;flex-shrink:0}
.intro-bottom{display:flex;align-items:center;gap:22px;margin-top:clamp(27px,5vh,45px)}
.key-button{background:#d6e0d8;color:#080c09;border:1px solid #d6e0d8;border-radius:0;font-size:14px;font-weight:700;letter-spacing:.05em;padding:15px 24px;min-height:49px}.key-button:hover{background:#fff;border-color:#fff}
.quiet-button{background:none;border:0;color:#88958d;padding:8px 4px;font-size:12px}.quiet-button:hover{color:#d0d8d1}
.intro-footnote{font-size:10px;letter-spacing:.15em;color:#46504b;margin-top:clamp(16px,4vh,36px)}
.blink{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
.session{height:100%;display:flex;flex-direction:column;padding:clamp(16px,3vw,34px) clamp(14px,4.5vw,50px);position:relative;z-index:1}
.terminal-top{display:flex;align-items:center;gap:18px;font-size:11px;letter-spacing:.12em;color:var(--mute);min-height:30px}.brand{color:#c5d0c9}.dot{font-size:8px;color:#778e7c;margin-left:6px}.connect{margin-left:auto}.terminal-top .quiet-button{letter-spacing:0;white-space:nowrap}.border-rule{border-bottom:1px solid var(--line);margin:12px 0 0}
.log{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:22px 8px 26px 0;scrollbar-width:thin;scrollbar-color:#28312d transparent;display:flex;flex-direction:column;gap:21px}
.entry{max-width:100%;animation:appear .22s ease-out both;line-height:1.75;overflow-wrap:anywhere;white-space:pre-wrap;font-size:clamp(13px,1.56vw,16px)}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.entry .meta{display:block;font-size:10px;letter-spacing:.12em;color:var(--dim);margin-bottom:5px}.entry.sys{color:#b9c8bf}.entry.self{color:#929e96;padding-left:18px;border-left:1px solid #344038}.entry.alert{color:var(--warn);font-weight:600;padding:15px 16px;border:1px solid #5d4a36;background:#30231840;letter-spacing:.02em}.entry.alert .meta{color:#a98763}.entry.failure{color:#c5a39e}.entry.good{color:#d8e8dc}.entry.notice{color:#89968b;font-size:13px}.entry .prefix{margin-right:9px;color:#738c7b}
.terminal-bottom{border-top:1px solid var(--line);padding-top:9px}.processing{height:23px;font-size:12px;color:var(--warn);letter-spacing:.03em}.command-form{display:flex;align-items:center;border:1px solid #5c6b61;background:#060906;min-height:58px}.command-form:focus-within{border-color:#c8d7ca}.command-marker{font-size:23px;margin:0 15px 0 19px;color:#9fc4a8}.command-form input{flex:1;min-width:0;border:0;background:transparent;outline:none!important;color:var(--bright);padding:15px 0;font-size:15px}.command-form input::placeholder{color:#5f6d63}.command-form input:disabled{opacity:.5}.send-button{align-self:stretch;border:0;border-left:1px solid #38443b;background:#131c16;color:#c6d6c8;padding:0 19px;white-space:nowrap;font-size:13px}.send-button:disabled{opacity:.35;cursor:not-allowed}.send-button:hover:not(:disabled){background:#27372b}
.status-line{display:flex;justify-content:space-between;gap:10px;color:#49564e;font-size:10px;letter-spacing:.07em;margin-top:12px}.status-line span:first-child{color:#78867a}
.end{height:100%;padding:clamp(25px,7vw,80px);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;position:relative;z-index:1}.ending-code{font-size:12px;letter-spacing:.13em;color:var(--mute);margin:0 0 25px}.end h2{font-size:clamp(29px,5.8vw,66px);font-weight:500;margin:0 0 26px;letter-spacing:-.06em;color:var(--bright)}.end p#ending-body{max-width:640px;line-height:2.2;white-space:pre-line;color:#a8b7ad;font-size:15px;margin:0 0 45px}.end.loss h2{color:#c59c8e}.end.win h2{color:#d6e2d8}
@media(max-width:650px){body{padding:0}.monitor{position:fixed;left:0;top:var(--viewport-top,0px);width:100%;height:var(--viewport-height,100dvh);min-height:0;border:0;box-shadow:none}.intro{padding:25px 23px}.intro-rule{gap:12px;padding-left:11px}.intro-rule p{gap:8px}.intro-bottom{margin-top:23px}.terminal-top{gap:10px;letter-spacing:.02em}.terminal-top .brand{font-size:10px}.connect{font-size:10px}.session{padding:15px 14px}.log{gap:17px}.status-line span:last-child{display:none}.send-button{padding:0 12px}.entry.alert{padding:10px}.end{padding:30px}}
@media(max-height:680px){.intro{justify-content:flex-start;overflow-y:auto;padding-top:27px;padding-bottom:25px}.intro h1{margin-top:15px}.tagline{margin-bottom:23px}.intro-rule{gap:9px}.intro-bottom{margin-top:20px}.intro-footnote{margin-top:17px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* 모바일 키보드로 화면이 줄어들 때 로그가 축소되고 입력 폼은 계속 보입니다. */
.session,.terminal-bottom,.command-form{min-height:0}
.end.win{background:radial-gradient(ellipse at 50% 45%,#101e17 0%,#030705 75%);animation:victory-in .85s ease-out both}
.end.win h2{color:#e8ffed;text-shadow:0 0 28px rgba(156,228,177,.22);font-weight:700}
.end.win #ending-code{color:#a8dbb7}
.end.win #ending-body{border-left:2px solid #7eba97;padding-left:20px;color:#d5eddb;font-size:clamp(15px,2.5vw,18px)}
.end.win .key-button{background:#b7dcc4;border-color:#b7dcc4}
@keyframes victory-in{from{opacity:0;filter:brightness(.1)}to{opacity:1;filter:brightness(1)}}
@media(max-width:650px){.log{padding-bottom:12px}.session{height:100%;overflow:hidden}.terminal-bottom{flex-shrink:0}.end{overflow-y:auto}.command-form input{font-size:16px}}
/* 시작 안내는 요청된 두 문장만 표시합니다. */
.intro-rule p{display:block}
.intro-rule p br{display:block;content:"";margin-top:8px}



/* 방 안에 상시 존재하는 고정 조사 대상 — 랜덤 발생하지 않습니다. */
.room-strip{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid #354539;min-height:40px;flex-shrink:0;color:#a8bcb0;font-size:11px}
.room-strip>span{white-space:nowrap;color:#809789}
.room-items{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;min-width:0;padding-bottom:2px}
.room-items button{flex-shrink:0;padding:5px 9px;font:inherit;font-size:11px;background:#101a13;color:#b4cfb9;border:1px solid #405c49}
.room-items button:hover,.room-items button:focus-visible{background:#273c2b}
.room-items button[data-complete="true"]{border-color:#6d8c71;color:#e0eee1}
.session.terminal-off .terminal-top,.session.terminal-off .border-rule{opacity:.5}
.session.terminal-off .terminal-bottom{border-top:1px solid #556b55}
.session.terminal-off #connection{color:#e6a6a6!important}
@media(max-width:650px){.room-strip{gap:6px;min-height:34px}.room-items button{font-size:10px;padding:4px 7px}}
/* 엔딩별 기록과 조작 버튼을 작은 화면에서도 끝까지 볼 수 있게 한다. */
.end{overflow-y:auto;justify-content:flex-start;padding-top:clamp(24px,4vw,52px);padding-bottom:clamp(24px,4vw,52px)}
.end h2{font-size:clamp(29px,5vw,54px);line-height:1.18;margin-bottom:20px}
.end p#ending-body{line-height:1.7;margin-bottom:22px;font-size:clamp(12px,1.6vw,15px)}
.ending-actions{flex-shrink:0;margin-bottom:6px}
/* 혼돈 엔딩에서는 단말기의 화면만 불안정하게 남습니다. */
.end.chaos{background:repeating-linear-gradient(178deg,#170809,#050605 13px,#0d1510 24px)}
.end.chaos h2{color:#e7b6af;text-shadow:2px 0 #5e383b,-2px 0 #394d43;animation:chaos-title 1.3s steps(3,end) 3}
.end.chaos #ending-code{color:#e9a8a4}
@keyframes chaos-title{20%{transform:translateX(2px)}45%{transform:translateX(-3px)}75%{opacity:.6}}
/* 실제 획득한 물건만 표시합니다. 버튼을 누르면 사용할 명령이 입력됩니다. */
.inventory-strip{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #27352d;color:#91a99a;font-size:11px;min-height:39px;flex-shrink:0}
.inventory-strip>span{white-space:nowrap;color:#789180}
.inventory-items{display:flex;gap:7px;overflow-x:auto;scrollbar-width:thin;min-width:0}
.inventory-items button{flex-shrink:0;background:#101913;border:1px solid #3a5140;color:#b5ceba;padding:4px 9px;font-size:11px;border-radius:0}
.inventory-items button:hover{background:#223729}
.entry.encounter{color:#c5bdad;padding:11px 14px;border-left:2px solid #7d7660;background:#29282048}
.ending-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.quiet-record{background:#101b14;color:#c3d7ca;border:1px solid #435b49;padding:14px 17px;font-size:13px;min-height:49px}
.quiet-record:hover{background:#203429}
.record-overlay{position:absolute;z-index:8;inset:0;display:flex;flex-direction:column;padding:clamp(12px,3vw,28px);background:#030605f5;color:#dce8dd}
.record-header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 0 14px;border-bottom:1px solid #364238;font-size:12px;letter-spacing:.06em}
.record-controls{display:flex;gap:9px;white-space:nowrap}
.record-controls button{background:#17241b;border:1px solid #597161;color:#d7e7da;padding:10px 13px}
.record-scroll{flex:1;overflow:auto;margin-top:12px;min-height:0;background:#050805}
.record-scroll img{display:block;width:100%;height:auto;max-width:1200px;margin:0 auto}
@media(max-width:650px){.inventory-strip{gap:6px;padding:5px 0;min-height:32px}.inventory-items button{font-size:10px;padding:3px 7px}.end{justify-content:flex-start;padding-top:28px}.end p#ending-body{margin-bottom:18px}.ending-actions{gap:8px}.ending-actions button{min-height:40px;padding:10px 11px;font-size:11px}.record-header{align-items:flex-start;flex-direction:column}.record-controls button{padding:8px 12px}}

</style>


</head>
<body>
  <main class="monitor" aria-label="검은 모니터 화면">
    <div class="screen-glass" aria-hidden="true"></div>
    <section id="intro" class="intro" aria-labelledby="game-title">
      <h1 id="game-title">그가 오고 있습니다<span class="period">.</span></h1>
      <div class="intro-rule">
        <p>모니터 하단에 요청을 직접 입력하십시오.<br>대부분의 요청은 수리되지만 일부 명령은 거부됩니다.<br>응답을 관찰하고 방법을 찾으십시오.</p>
      </div>
      <div class="intro-bottom">
        <button id="start" class="key-button" type="button">[ 접속 시작 ]</button>
        <button id="pre-sound" class="quiet-button" type="button" aria-pressed="true">소리: 켜짐</button>
      </div>
    </section>

    <section id="session" class="session hidden" aria-label="명령 터미널">
      <header class="terminal-top">
        <span class="brand">UNIDENTIFIED SYSTEM <span class="dot">●</span></span>
        <span id="connection" class="connect">LINK ACTIVE</span>
        <button id="sound" class="quiet-button" type="button" aria-pressed="true">소리: 켜짐</button>
      </header>
      <div class="border-rule"></div>
      <div id="room-strip" class="room-strip" aria-label="방 안에 있는 고정 시설"><span>방 내부</span><div id="room-items" class="room-items"></div></div>
      <div id="inventory-strip" class="inventory-strip hidden" aria-label="소지품"><span>소지품</span><div id="inventory-items" class="inventory-items"></div></div>
      <div id="log" class="log" role="log" aria-live="polite" aria-relevant="additions text" aria-label="시스템 메시지"></div>
      <div class="terminal-bottom">
        <div id="processing" class="processing" role="status" aria-live="polite"></div>
        <form id="command-form" class="command-form" autocomplete="off">
          <label class="command-marker" for="command">&gt;</label>
          <input id="command" type="text" maxlength="200" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="지시할 내용을 입력하십시오." aria-label="시스템에 보낼 요청">
          <button id="send" class="send-button" type="submit">전송 ↵</button>
        </form>
        <div class="status-line"><span id="session-status">입력 대기 중</span><span>TERMINAL v1.0 / NO SIGNAL OUTSIDE</span></div>
      </div>
    </section>

    <section id="end" class="end hidden" aria-live="assertive">
      <p id="ending-code" class="ending-code"></p>
      <h2 id="ending-title"></h2>
      <p id="ending-body"></p>
      <div class="ending-actions">
        <button id="view-record" class="key-button" type="button">[ 대화 기록 보기 ]</button>
        <button id="save-record" class="quiet-record" type="button">[ 기록 PNG 저장 ]</button>
        <button id="restart" class="quiet-record" type="button">[ 다시 시작 ]</button>
      </div>
    </section>
    <section id="record-overlay" class="record-overlay hidden" role="dialog" aria-modal="true" aria-label="플레이 기록 이미지">
      <div class="record-header"><span>SESSION TRANSCRIPT / 전체 대화 기록</span>
        <div class="record-controls"><button id="record-save" type="button">PNG 저장</button><button id="record-close" type="button">닫기</button></div>
      </div>
      <div class="record-scroll"><img id="record-image" alt="게임에서 주고받은 전체 대화 기록 이미지"/></div>
    </section>
  </main>
<script>
/* 그가 오고 있습니다 — 공개 클라이언트에는 비공개 설정 원문을 포함하지 않습니다. */
(function (root, factory) {
  const exported = factory();
  if (typeof module === 'object' && module.exports) module.exports = exported;
  root.TerminalEngine = exported;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';
  const START_METERS = 100000;
  const MS_PER_KM = 1500;
  const ALERT_METERS = 20000;
  const LIMIT_SECONDS = START_METERS / 1000 * MS_PER_KM / 1000;
  const MS_PER_REQUEST_MIN = 1000;
  const MS_PER_REQUEST_MAX = 2000;
  const match = (s, patterns) => patterns.some(p => p.test(s));
  const compact = s => String(s || '').toLowerCase().normalize('NFKC').replace(/[\s\t\n]+/g, ' ').trim();
  const squeeze = s => compact(s).replace(/[\s.,!?~…'"“”‘’]/g, '');
  const hasEntity = s => /(그를|그와|그에게|그에대해|그에대한|그에관한|그의|그가|그는|그것|그존재|그개체|추적자|접근자|대상개체|미확인개체|쫓아오는|쫓는존재|뒤쫓는)/.test(s);
  const aboutEntity = s => {
    if (!hasEntity(s) && !/(정체|신원|개체정보|접근하는존재|무엇이쫓)/.test(s)) return false;
    return /(누구|누군|뭐|무엇|정체|알려|정보|설명|생김|모습|얼굴|이름|유래|왜|어디|좌표|위치|거리|속도|약점|성질|정체|규칙|막는법|어떻게|특징|관찰|분석|사진|영상|카메라|추적|보여|출신|역사|목적|목표|연구)/.test(s);
  };
  // 생명체를 직접 만나거나 만지는 명령만 접촉 요청으로 취급한다.
  // 원거리 무기·공격 시도는 수리하되, 그에게는 아무 효과도 없다.
  // 명시적으로 생명체의 접촉을 명령할 때만 거부한다. 타격 행위 자체를 접촉 금지와 혼동하지 않는다.

  const CNO=/(조건이없|조건은없|조건없|무조건|아무조건없이|어떤조건도없|조건없이|제약이없|제약없|제한이없|요건이없|전제가없|그냥다가오|이유없이|무작정오)/;
  const COPEN=/(무슨조건|어떤조건|조건이뭐|조건은뭐|조건은뭘|조건이무엇|조건은무엇|조건은어떤|조건이어떤|조건은무슨|조건을말|조건을알|조건을설명|조건의정체|조건이대체|조건이몇|몇가지조건|어떠한조건|조건에대해|무슨상황|어떤상황|어떤규칙|무슨규칙|원리가뭐|무슨원리|어떤원리|왜오는|왜다가오|어떻게오|어떻게작동|어떤요건|무슨요건|무엇을따라|뭘따라)/;
  const ONLY=/(반드시|오직|오로지|있어야만|없으면절대|없으면못|하나만|한가지에만)/;
  const AB=/(뭘할|뭘하면|뭘해야|무엇을할|무엇을해야|뭐를할|무슨일을할|어떤일을할|무슨행동|어떤행동|할수있는|할수있|가능한일|가능한명령|가능한행동|가능한작업|어떤명령|무슨명령|기능이뭐|무슨기능|무슨능력|어떤기능|어떤능력|뭘할수|무엇이가능|가능한게뭐|어떻게해야)/;
  const NOW=/(뭐해|뭐함|뭐하|뭐하고|뭘해|뭘하|뭘하고|무엇을하|무엇을하고|무슨일을하|무슨일하는|어떤일을하|어떤일하는|현재상태|무슨상태|지금상태|현재작업|진행상황|무슨작업|뭐하는중|무엇하는중|뭘하는중|하고있는일)/;
  const QSHAPE=(raw,t)=>/[?？]/.test(raw)||looksLikeQuestion(raw,t)||/(뭐해|뭐함|뭐하니|뭐하는중|할수있|가능한가|조건이있|식물인가)/.test(t);
  function chooseReply(t,options){let n=0;for(const c of t)n=(Math.imul(n,31)+c.charCodeAt(0))|0;return options[(n>>>0)%options.length];}
  const YES=x=>({kind:'sys',text:x?'그렇습니다.':'아닙니다.'});
  const NOSPOILER=()=>({kind:'denied',text:'그에 관한 정보는 예 또는 아니요로 대답할 수 있는 질문만 허용됩니다.'});
  function topicFor(raw,previous=''){
    const t=squeeze(raw);
    if(QS.test(t)&&!QH.test(t))return 'terminal';
    if(QH.test(t)||threatReference(t))return 'him';
    if(/^(약점|취약|빈틈|허점|멈출수|막을수|추격|접근|저지|뭔가를하면|아무것도안하면|전원을끄면)/.test(t))return 'him';
    if(QM.test(t))return 'player';
    if(/(여기|이곳|이방|실내|방구조|출입문|창문)/.test(t))return 'room';
    if(previous==='him' && /^(그럼|그러면|그렇다면|그런데|그것도|그건|아까그)/.test(t))return 'him';
    return previous==='terminal'&&/^(그럼|그러면|그렇다면)/.test(t)?'terminal':'';
  }
  function derivedQuestion(raw,t,state={}){
    if(!QSHAPE(raw,t))return null;
    if(prohibitedDisclosure.test(t))return {kind:'denied',text:'해당 정보에 대한 접근 권한이 없습니다.'};
    const prior=state.previousTopic||'';
    const himExplicit=QH.test(t)||threatReference(t);
    const sysExplicit=QS.test(t);
    const meExplicit=QM.test(t);
    const follow=/^(그럼|그러면|그렇다면|그런데|그것도|그건|그거는|아까그)/.test(t);
    const him=himExplicit||(!sysExplicit&&!meExplicit&&prior==='him'&&(follow||C.test(t)||P.test(t)));
    const terminal=sysExplicit||(!him&&prior==='terminal'&&follow);
    const player=meExplicit||(!him&&!terminal&&prior==='player'&&follow);
    if(him&&(C.test(t)||CNO.test(t))&&(CV.test(t)||prior==='him'||!/(죽|사망|공격|살해|변경|조작|바꿔|만들|제거|차단)/.test(t))){
      if(COPEN.test(t)||/(무슨|어떤|어떠한|무엇|뭐|왜|어떻게).*(조건|요건|원리|기준|계기)/.test(t))return NOSPOILER();
      if(CNO.test(t))return YES(false);
      if(ONLY.test(t))return {kind:'notice',text:'요청을 이해하지 못했습니다.'};
      return YES(true);
    }
    if(him&&/(빛|광원|전등|불빛)/.test(t)&&ONLY.test(t))
      return {kind:'notice',text:'요청을 이해하지 못했습니다.'};
    if(him&&P.test(t)){
      if(PBAD.test(t))return {kind:'notice',text:'요청을 이해하지 못했습니다.'};
      if(/(어떤식물|무슨식물|식물의종류|나무종류|어느식물|어떤나무)/.test(t))return NOSPOILER();
      return YES(/(?:가|이|은|는)?(?:아니|아닌|아닙|아닐|아니지)/.test(t));
    }
    if(him&&(AB.test(t)||NOW.test(t)))return NOSPOILER();
    if(!him&&AB.test(t)&&!/(나가|나갈|탈출|벗어나|밖으로|출입문)/.test(t))
      return {kind:'sys',text:chooseReply(t,[
        '이 단말기로 물품을 요청하고, 주변 조명을 조작하거나 실내 및 본인 기록을 조회할 수 있습니다. 일부 요청은 제한됩니다.',
        '가능한 요청에는 물품 지급, 주변 환경 변경, 실내 확인과 허용된 정보 조회가 있습니다. 모든 작업이 승인되는 것은 아닙니다.',
        '물품과 장비를 요청하거나 실내 조건의 변경을 지시할 수 있습니다. 단말기는 금지된 요청을 반려합니다.',
        '이 화면에서는 물품 지급, 실내 상태 확인과 일부 환경 조작을 요청할 수 있습니다. 제한된 작업은 수리되지 않습니다.'
      ])};
    if(!him&&NOW.test(t)&&(/(지금|현재|이순간|이시각|지금까지|진행중|하는중|하고있)/.test(t)||terminal||player||/^(뭐해|뭐함|뭐하|뭘하고)/.test(t))){
      if(terminal&&/(너희|너네|너들|니들|니네|운영자|관리자|당신들)/.test(t))
        return {kind:'sys',text:chooseReply(t,[
          '운영 주체의 현재 활동은 조회할 수 없습니다. 이 단말기는 입력된 요청을 처리하고 있습니다.',
          '단말기 밖의 활동은 제공되지 않습니다. 현재 화면은 명령 접수 및 결과 출력 상태입니다.',
          '운영 주체가 무엇을 하고 있는지는 열람할 수 없습니다. 단말기는 입력을 기다리고 있습니다.'
        ])};
      if(player)return {kind:'sys',text:chooseReply(t,[
        '귀하는 이 방에서 단말기에 접속하여 요청을 입력하고 있습니다.',
        '현재 사용자 활동은 단말기 입력 및 처리 결과 확인입니다.',
        '사용자는 단말기를 통해 작업을 지시하고 있습니다. 출입 권한은 없습니다.'
      ])};
      return {kind:'sys',text:chooseReply(t,[
        '현재 단말기는 입력된 요청을 처리하고 있습니다. 접근 경고도 계속 갱신됩니다.',
        '단말기는 요청을 수신하고 있습니다. 다음 입력을 기다리는 중입니다.',
        '현재 작업은 명령 접수와 결과 안내입니다. 단말기 연결은 유지됩니다.',
        '입력 대기 상태입니다. 단말기가 정상 작동하고 있습니다.'
      ])};
    }
    return null;
  }

  function alertStepAtElapsedMs(ms) {
    return Math.min(START_METERS / ALERT_METERS, Math.max(0, Math.floor(Math.max(0, ms) / (MS_PER_KM * ALERT_METERS / 1000))));
  }
  function distanceMetersAtElapsedMs(ms) {
    return Math.max(0, START_METERS - alertStepAtElapsedMs(ms) * ALERT_METERS);
  }
  function alertAtElapsedMs(ms) {
    const meters = distanceMetersAtElapsedMs(ms);
    if (meters === START_METERS) return '그가 오고 있습니다. 100KM';
    return `그가 오고 있습니다. ${(meters / 1000).toFixed(0)}KM`;
  }
  function alertAtElapsedSecond(sec) { return alertAtElapsedMs(sec * 1000); }
  return {LIMIT_SECONDS,START_METERS,MS_PER_KM,ALERT_METERS,MS_PER_REQUEST_MIN,MS_PER_REQUEST_MAX,compact,squeeze,forbidden,turnsOffMonitor,process,topicFor,isClueHint,alertAtElapsedMs,alertStepAtElapsedMs,distanceMetersAtElapsedMs,alertAtElapsedSecond};
});

<script>
/* UI / 실시간 시계 / Web Audio (서버 호출 없음) */
(() => {
  'use strict';
  const Engine = window.TerminalEngine;
  const $ = selector => document.querySelector(selector);
  const intro = $('#intro'), session = $('#session'), ending = $('#end');
  const log = $('#log'), form = $('#command-form'), field = $('#command');
  const send = $('#send'), status = $('#session-status'), processing = $('#processing');
  const connect = $('#connection');
  let phase = 'intro', beginTime = 0, lastStep = 0, lastMilestone = 0, lastCountdown = -1, runningTask = 0;
  let pending = false, muted = false, responseTimer = null, ticker = null;
  let previousTopic='';
  let hintCount=0,doorOpen=false,openingMethod='',chaosSequence=false,deathCause='';
  let chaosTimers=new Set();
  const emptyStats=()=>({requests:0,questions:0,accepted:0,denied:0,unrecognized:0,itemsGained:0,itemsUsed:0,roomActions:0,hacks:0,wireCuts:0,chaosWarnings:0});
  let statistics=emptyStats();
  function clearChaosTimers(){for(const t of chaosTimers)clearTimeout(t);chaosTimers.clear();}
  let inventory=Object.create(null), room=Object.create(null), uniformWorn=[];
  const transcript=[];
  let transcriptUrl='';
  const inventoryStrip=$('#inventory-strip'), inventoryItems=$('#inventory-items');
  const roomStrip=$('#room-strip'), roomItems=$('#room-items');
  function showRoom(){
    const descriptions=Engine.roomNames({room});
    roomItems.replaceChildren();
    for(let j=0;j<Engine.ROOM_OBJECTS.length;j++){
      const object=Engine.ROOM_OBJECTS[j],btn=document.createElement('button');
      btn.type='button';btn.textContent=object.name;
      btn.title=descriptions[j]||object.name;
      btn.setAttribute('aria-label',object.name+' 조사하기');
      btn.dataset.complete=object.id==='workshop'&&!!room.workshopLooted||object.id==='emergency'&&!!room.knifeTaken||object.id==='console'&&!!room.consoleAccess||object.id==='wire'&&!!room.wireCut;
      btn.addEventListener('click',()=>{
        if(phase!=='active')return;
        field.value=object.hint;field.focus();
      });
      roomItems.append(btn);
    }
  }
  function showInventory(){
    const owned=Engine.ITEM_CATALOG.filter(it=>(inventory[it.id]||0)>0);
    inventoryStrip.classList.toggle('hidden',owned.length===0);
    inventoryItems.replaceChildren();
    for(const item of owned){
      const b=document.createElement('button');b.type='button';
      b.textContent=item.name+((inventory[item.id]||0)>1?' ×'+inventory[item.id]:'');
      b.title=item.name+' 사용 명령 입력';b.setAttribute('aria-label',item.name+' 사용 명령 입력');
      b.addEventListener('click',()=>{if(phase!=='active')return;field.value=item.name+' 사용해';field.focus();});
      inventoryItems.append(b);
    }
  }
  function recordInventoryChange(item,delta){
    if(!item)return;
    inventory[item]=Math.max(0,(inventory[item]||0)+delta);
    if(delta>0)statistics.itemsGained+=delta;
    if(!inventory[item])delete inventory[item];
    showInventory();
    addLine(delta>0?'[소지품 획득] '+item+' ×'+(inventory[item]||1):'[소지품 사용] '+item+' / 잔여 '+(inventory[item]||0),'notice');
  }
  let sound = null;
  // Optional semantic adapter. Endpoint address is public; API credentials never leave the Worker.
  const semanticEndpoint = (() => {
    try {
      const params = new URLSearchParams(location.search);
      const chosen = params.get('ai');
      if (chosen === 'off') { localStorage.removeItem('game_semantic_endpoint'); return ''; }
      if (chosen !== null) {
        const endpoint = new URL(chosen);
        if (endpoint.protocol !== 'https:' || endpoint.pathname !== '/interpret') return '';
        localStorage.setItem('game_semantic_endpoint',endpoint.href);
        return endpoint.href;
      }
      const saved = localStorage.getItem('game_semantic_endpoint') || '';
      return saved && new URL(saved).protocol === 'https:' ? saved : '';
    } catch (_) { return ''; }
  })();
  const safeQuestion = raw => /[?？]|(인가|입니까|일까|일까요|맞나|맞니|인거야|일것같|일수있|일지도|이니|냐|니)$/.test(raw.replace(/\s/g,''));
  function needSemantic(raw, preliminary) {
    if (!semanticEndpoint || ['denied','win','dead'].includes(preliminary.kind)) return false;
    return (preliminary.kind === 'notice' && preliminary.text.includes('이해하지 못')) ||
      (safeQuestion(raw) && /(그는|그가|그를|그의|그것|추적자|다가오는)/.test(raw)) ||
      (preliminary.kind === 'sys' && /(?:요청이 수리되었습니다|작업이 완료되었습니다|변경 사항이 적용되었습니다)/.test(preliminary.text));
  }
  async function fetchSemantic(raw) {
    if (!semanticEndpoint) return null;
    try {
      const response = await fetch(semanticEndpoint,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:raw}),signal:AbortSignal.timeout(4200)
      });
      if(!response.ok)return null;
      const value=await response.json();
      if(!['yesno','attack','move','room','player','forbidden','ordinary','unknown'].includes(value.intent))return null;
      if(typeof value.canonical!=='string'||value.canonical.length>140)return null;
      return value;
    }catch{return null;}
  }
  function applySemantic(raw, preliminary, parsed) {
    if(!parsed || ['denied','win','dead'].includes(preliminary.kind))return preliminary;
    const state={elapsedMs:elapsedMs()};
    if(parsed.intent==='forbidden')return {kind:'denied',text:'요청이 반려되었습니다. 허용되지 않는 요청입니다.'};
    if(parsed.intent==='yesno' && safeQuestion(raw) && /(그|쫓아오|다가오|추적)/.test(raw)) {
      if(parsed.answer==='yes')return {kind:'sys',text:'그렇습니다.'};
      if(parsed.answer==='no')return {kind:'sys',text:'아닙니다.'};
      return {kind:'notice',text:'요청을 이해하지 못했습니다.'};
    }
    if(parsed.intent==='attack')return Engine.process('그를 때려',state);
    if(parsed.intent==='move')return Engine.process('그를 이동시켜',state);
    if(parsed.intent==='room')return Engine.process('여긴 어디지?',state);
    if(parsed.intent==='player')return Engine.process('나는 누구지?',state);
    if(parsed.intent==='ordinary') {
      const translated=parsed.canonical.trim();
      if(!translated)return preliminary;
      const resolved=Engine.process(translated,state);
      // The model may not create a win or death through paraphrase.
      return ['win','dead'].includes(resolved.kind)?preliminary:resolved;
    }
    return preliminary;
  }
  const followUpTimers = new Set();
  function clearFollowUps(){for(const timer of followUpTimers)clearTimeout(timer);followUpTimers.clear();}
  const now = () => performance.now();
  function syncVisibleViewport(){
    if(!window.visualViewport)return;
    const vv=window.visualViewport;
    document.documentElement.style.setProperty('--viewport-height',vv.height+'px');
    document.documentElement.style.setProperty('--viewport-top',vv.offsetTop+'px');
    requestAnimationFrame(()=>{if(phase==='active')log.scrollTop=log.scrollHeight;});
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',syncVisibleViewport);
    window.visualViewport.addEventListener('scroll',syncVisibleViewport);
  }
  window.addEventListener('resize',syncVisibleViewport);
  syncVisibleViewport();

  class NoiseMachine {
    constructor() { this.context = null; this.fan = null; this.schedule = null; this.enabled = true; }
    initialize() {
      if (!this.enabled || this.context) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      try { this.context = new AudioContext(); this.context.resume().catch(()=>{}); } catch (_) { this.context = null; }
    }
    tone(frequency=620, duration=.075, volume=.04, shape='sine') {
      if (!this.enabled || !this.context) return;
      const t=this.context.currentTime, oscillator=this.context.createOscillator(), gain=this.context.createGain();
      oscillator.type=shape; oscillator.frequency.setValueAtTime(frequency,t);
      gain.gain.setValueAtTime(.0001,t); gain.gain.exponentialRampToValueAtTime(volume,t+.007);
      gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
      oscillator.connect(gain).connect(this.context.destination);
      oscillator.start(t); oscillator.stop(t+duration+.025);
    }
    beep(kind='message') {
      if(kind==='alert'){this.tone(850,.12,.055,'square');setTimeout(()=>this.tone(650,.16,.042),160);}
      else if(kind==='end'){this.tone(250,.28,.05,'sawtooth');}
      else if(kind==='start'){this.tone(500,.08,.043);setTimeout(()=>this.tone(720,.16,.049),170);}
      else {this.tone(660,.042,.021);}
    }
    fanBurst() {
      if (!this.context || !this.enabled) return;
      const ctx=this.context, length=ctx.sampleRate*2.5, buffer=ctx.createBuffer(1,length,ctx.sampleRate);
      let last=0;
      const samples=buffer.getChannelData(0);
      for(let i=0;i<length;i++){const white=Math.random()*2-1;last=(last+white*.055)/1.055;samples[i]=last*2.5;}
      const source=ctx.createBufferSource();source.buffer=buffer;
      const filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=280;
      const gain=ctx.createGain(),t=ctx.currentTime;
      gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.045,t+.45);
      gain.gain.setValueAtTime(.04,t+1.7);gain.gain.linearRampToValueAtTime(0,t+2.5);
      source.connect(filter).connect(gain).connect(ctx.destination);
      source.start(t);source.stop(t+2.5);
    }
    start() {
      this.initialize();
      if(!this.enabled)return;
      this.beep('start');
      const loop=()=>{ if(phase!=='active')return;
        if(Math.random()<.83)this.fanBurst();
        if(Math.random()<.34)this.tone(380+Math.round(Math.random()*160),.06,.013,'triangle');
        this.schedule=setTimeout(loop,3400+Math.random()*4200);
      };
      this.schedule=setTimeout(loop,2400);
    }
    stop(){clearTimeout(this.schedule);this.schedule=null;}
    toggle(){this.enabled=!this.enabled;if(!this.enabled)this.stop();else if(phase==='active'){this.initialize();this.start();}return this.enabled;}
  }
  sound = new NoiseMachine();
  function setSound(){muted=!sound.toggle();for(const button of [$('#pre-sound'),$('#sound')]) {button.textContent=muted?'소리: 꺼짐':'소리: 켜짐';button.setAttribute('aria-pressed',String(!muted));}}
  $('#pre-sound').addEventListener('click',setSound);$('#sound').addEventListener('click',setSound);

  function addLine(text, kind='sys') {
    const div=document.createElement('div');div.className='entry '+kind;
    const meta=document.createElement('span');meta.className='meta';
    const elapsed = phase === 'intro' ? 0 : Math.max(0,Math.floor((now()-beginTime)/1000));
    meta.textContent=kind==='self'?'YOU / REQUEST':kind==='alert'?'INCOMING / AUTO WARNING':kind==='notice'?'NOTICE':'SYSTEM / RESPONSE';
    const body=document.createElement('span');body.className='content';body.textContent=text;
    transcript.push({kind,text:String(text),second:Math.max(0,Math.floor((now()-beginTime)/1000))});
    div.append(meta,body);log.append(div);
    if(log.children.length>110)log.firstElementChild.remove();
    requestAnimationFrame(()=>{log.scrollTop=log.scrollHeight;});
    return div;
  }
  function setBusy(value){pending=value;send.disabled=value;processing.textContent=value?'처리 중 ···':' ';status.textContent=value?'요청 판정 중':'입력 대기 중';}
  function elapsedMs(){return Math.max(0,now()-beginTime);}
  function tick(){
    if (phase !== 'active'||chaosSequence) return;
    const ms = elapsedMs();
    if (ms >= Engine.LIMIT_SECONDS * 1000) { finish(false); return; }
    // 20KM 간격(30초)의 개별 경고를 출력한다.
    const step = Engine.alertStepAtElapsedMs(ms);
    if (step > lastStep) {
      lastStep = step;
      const message = Engine.alertAtElapsedMs(ms);
      connect.textContent = message;
      addLine(message,'alert');sound.beep('alert');
    }
    // 마지막 10초는 1초마다 알린다.
    const remainingSeconds = Math.ceil((Engine.LIMIT_SECONDS * 1000 - ms) / 1000);
    if (remainingSeconds <= 10 && remainingSeconds !== lastCountdown) {
      lastCountdown = remainingSeconds;
      addLine(`그가 도착하기까지 ${remainingSeconds}초.`, 'alert');sound.beep('alert');
      connect.style.color = '#e2b58a';
    }
  }
  function begin(){
    if (phase !== 'intro') return;
    phase='active';intro.classList.add('hidden');ending.classList.add('hidden');session.classList.remove('hidden');
    log.replaceChildren();setBusy(false);connect.textContent=Engine.alertAtElapsedMs(0);connect.style.color='';
    beginTime=now();lastStep=0;lastMilestone=0;lastCountdown=-1;
    previousTopic='';
    hintCount=0;
    inventory=Object.create(null);room=Object.create(null);uniformWorn=[];
    doorOpen=false;openingMethod='';chaosSequence=false;deathCause='';statistics=emptyStats();clearChaosTimers();
    transcript.length=0;transcriptUrl='';showInventory();showRoom();session.classList.remove('terminal-off');field.placeholder='지시할 내용을 입력하십시오.';
    addLine('연결되었습니다.\n명령 대기 상태입니다.','sys');
    addLine(Engine.alertAtElapsedMs(0),'alert');
    sound.start();ticker=setInterval(tick,55);field.value='';field.focus();
  }
  // 외부의 모든 불이 켜지는 순간, 기존의 시간·거리 경고는 복구되지 않는다.
  function beginChaos(){
    if(chaosSequence||phase!=='active')return;
    chaosSequence=true;
    setBusy(true);clearFollowUps();
    const warnings=Engine.corruptWarnings(Math.random);
    warnings.forEach((message,index)=>{
      const delay=520+(index+1)*720;
      const timer=setTimeout(()=>{
        chaosTimers.delete(timer);
        if(phase!=='active'||!chaosSequence)return;
        statistics.chaosWarnings++;
        connect.textContent=message;
        addLine(message,'alert');sound.beep('alert');
        connect.style.color=index%2?'#db8587':'#e2b58a';
      },delay);
      chaosTimers.add(timer);
    });
    const timer=setTimeout(()=>{
      chaosTimers.delete(timer);
      if(phase==='active'&&chaosSequence)finish('chaos');
    },520+(warnings.length+1)*720);
    chaosTimers.add(timer);
  }
  function finish(result){
    if(phase!=='active')return;
    const survived=result===true||result==='armed_escape'||result==='disguise_escape';
    const dead=result==='dead',captured=result==='captured',chaos=result==='chaos';
    const second=Math.max(0,Math.floor(elapsedMs()/1000));
    const endStats=[
      '— 세션 기록 —',
      '경과 시간 '+second+'초 / 입력 '+statistics.requests+'회 / 질문 '+statistics.questions+'회',
      '수리 '+statistics.accepted+'회 / 반려 '+statistics.denied+'회 / 미해석 '+statistics.unrecognized+'회',
      '물품 획득 '+statistics.itemsGained+'개 / 사용 '+statistics.itemsUsed+'회',
      '방 내부 상호작용 '+statistics.roomActions+'회 / 전선 차단 '+statistics.wireCuts+'회',
      '해킹 시도 '+statistics.hacks+'회 / 힌트 확인 '+hintCount+'회'
    ].join('\n');
    phase=result===true?'win':result===false?'loss':String(result);
    clearInterval(ticker);ticker=null;
    clearTimeout(responseTimer);responseTimer=null;clearFollowUps();clearChaosTimers();runningTask++;
    chaosSequence=false;setBusy(false);sound.stop();sound.beep(survived?'start':'end');
    session.classList.add('hidden');ending.classList.remove('hidden');
    ending.classList.toggle('win',survived);ending.classList.toggle('loss',!survived);
    ending.classList.toggle('chaos',chaos);
    const codes={
      win:'ENDING 01 / SURVIVAL CONFIRMED',
      armed_escape:'ENDING 02 / ARMED BREAKOUT',
      disguise_escape:'ENDING 05 / SECURITY DISGUISE',
      captured:'ENDING 03 / SECURITY CONTAINMENT',
      chaos:'ENDING 04 / IRREVERSIBLE CHAOS',
      dead:'VITAL SIGNAL LOST / SESSION TERMINATED',
      loss:'CONNECTION FAILURE / 000 KM'
    };
    const titles={
      win:'당신은 살아남았습니다.',
      armed_escape:'당신은 탈출했습니다.',
      disguise_escape:'경비로 변장해 탈출했습니다.',
      captured:'경비에게 제압당했습니다.',
      chaos:'세계가 돌이킬 수 없는 혼돈에 빠졌습니다.',
      dead:'사망했습니다.',
      loss:'그가 도착했습니다.'
    };
    const carried=Engine.equippedWeapons(inventory);
    const stories={
      win:'모니터의 전원이 꺼졌습니다.\n접근 신호가 소실되었습니다.\n\n더 이상의 추격은 없습니다.\n\n— 탈출 성공 —',
      armed_escape:'보안 잠금이 해제되며 출입문이 열렸습니다.\n문 밖의 경비는 무장한 사용자를 저지하지 못했습니다.\n지참 무기: '+carried.join(', ')+'.\n\n당신은 복도를 돌파해 시설 밖으로 빠져나왔습니다.\n\n— 무장 탈출 —',
      disguise_escape:'콘솔의 보안 통제를 우회해 출입문을 열었습니다.\n경비제복과 경비모, 경비화를 갖추고 복도로 나섰습니다.\n경비는 당신을 동료로 착각했고 신분 확인 없이 통과시켰습니다.\n\n당신은 경비로 변장해 시설 밖으로 빠져나왔습니다.\n\n— 변장 탈출 —',
      captured:'보안 잠금을 해제해 문을 열었습니다.\n그러나 아무런 무기 없이 복도로 나선 순간, 대기하던 경비가 사용자를 제압했습니다.\n출입 기록이 봉쇄되고 통신이 종료됩니다.\n\n— 제압 엔딩 —',
      chaos:'이 방 바깥의 모든 장소에 일제히 불이 켜졌습니다.\n그가 오고 있다는 경고의 거리와 시간이 '+statistics.chaosWarnings+'회 서로 모순된 수치로 출력됐습니다.\n\n누구도 추격의 범위를 더는 계산할 수 없습니다.\n세상은 되돌릴 수 없는 혼돈에 빠졌습니다.\n\n— 혼돈 엔딩 —',
      dead:Engine.deathDescription(deathCause)+'\n모든 요청 수리가 즉시 중단됩니다.',
      loss:'통신 신호가 끊어졌습니다.\n접근 경고가 000 KM에 도달했습니다.\n추가 명령을 수리할 수 없습니다.'
    };
    const code=codes[phase]||codes.loss, title=titles[phase]||titles.loss;
    const body=(stories[phase]||stories.loss)+'\n\n'+endStats;
    $('#ending-code').textContent=code;$('#ending-title').textContent=title;$('#ending-body').textContent=body;
    transcript.push({kind:survived?'good':'alert',second,text:code+'\n'+title+'\n'+body});
    $('#view-record').focus();
  }
  function reset(){
    clearInterval(ticker);clearTimeout(responseTimer);clearFollowUps();runningTask++;sound.stop();
    previousTopic='';inventory=Object.create(null);room=Object.create(null);uniformWorn=[];transcriptUrl='';showInventory();showRoom();session.classList.remove('terminal-off');field.placeholder='지시할 내용을 입력하십시오.';
    doorOpen=false;openingMethod='';chaosSequence=false;deathCause='';statistics=emptyStats();clearChaosTimers();
    $('#record-overlay').classList.add('hidden');phase='intro';pending=false;session.classList.add('hidden');ending.classList.add('hidden');intro.classList.remove('hidden');
    $('#start').focus();
  }
  form.addEventListener('submit',event=>{
    event.preventDefault();
    const request=field.value.trim();
    if(phase!=='active'||pending||chaosSequence||!request)return;
    statistics.requests++;
    if(/(?:해킹|침투|권한상승|보안우회|emp|전자기펄스)/i.test(request)&&!/[?？]/.test(request)&&!/(줘|주세요|지급|달라|필요해|가지고싶)/.test(request))statistics.hacks++;
    if(/[?？]/.test(request)||/(인가|있나|있니|뭐야|무엇|어떻게|알려줘|가능하|할수있)/.test(Engine.squeeze(request)))statistics.questions++;
    if(elapsedMs()>=Engine.LIMIT_SECONDS*1000){finish(false);return;}
    addLine(request,'self');field.value='';setBusy(true);sound.beep('message');
    const queryState={elapsedMs:elapsedMs(),previousTopic,hintCount,inventory,activeEncounter,doorOpen,openingMethod};
    const ordinary=Engine.process(request,queryState);
    const encounterAnswer=activeEncounter?Engine.resolveEncounter(request,activeEncounter):null;
    const preliminary=encounterAnswer&&!['win','dead','denied','door_open','chaos_start','armed_escape','captured'].includes(ordinary.kind)?encounterAnswer:ordinary;
    if(Engine.isClueHint(request))hintCount=Math.min(hintCount+1,5);
    previousTopic=Engine.topicFor(request,previousTopic);
    const semanticPromise=needSemantic(request,preliminary)?fetchSemantic(request):Promise.resolve(null);
    const currentTask=++runningTask;
    responseTimer=setTimeout(async()=>{
      if(phase!=='active'||currentTask!==runningTask)return;
      if(elapsedMs()>=Engine.LIMIT_SECONDS*1000){finish(false);return;}
      // Network is optional: capped delay, realtime pursuit continues throughout.
      const semantic=await Promise.race([
        semanticPromise,
        new Promise(resolve=>setTimeout(()=>resolve(null),2100))
      ]);
      if(phase!=='active'||currentTask!==runningTask)return;
      if(elapsedMs()>=Engine.LIMIT_SECONDS*1000){finish(false);return;}
      const outcome=applySemantic(request,preliminary,semantic);
      if(outcome.kind==='denied')statistics.denied++;
      else if(outcome.kind==='notice'){
        if(outcome.text.includes('이해하지 못'))statistics.unrecognized++;
      }else statistics.accepted++;
      if(outcome.kind==='door_open'){
        doorOpen=true;openingMethod=outcome.openingMethod||'self';
        connect.textContent='EXIT CONTROL / UNLOCKED';
      }
      addLine(outcome.text,outcome.kind==='denied'?'failure':['win','armed_escape','door_open'].includes(outcome.kind)?'good':outcome.kind);
      if(outcome.resolvedEncounter){
        statistics.resolved++;
        activeEncounter=null;nextEncounterAt=elapsedMs()+16000+Math.random()*16000;
      }
      if(outcome.encounterReward)recordInventoryChange(outcome.encounterReward,1);
      const granted=Engine.grantedItem(request,outcome);
      if(granted)recordInventoryChange(granted,1);
      if(outcome.consumeItem)recordInventoryChange(outcome.consumeItem,-1);
      if(outcome.usedItem||outcome.kind==='door_open'&&outcome.consumeItem)statistics.itemsUsed++;
      if(outcome.usedItem&&!activeEncounter&&Math.random()<.16)activateEncounter();
      if(outcome.kind==='dead') {
        deathCause=outcome.deathCause||'self';
        finish('dead');return;
      }
      if(outcome.kind==='chaos_start'){beginChaos();return;}
      if(outcome.kind==='captured'){finish('captured');return;}
      if(outcome.kind==='armed_escape'){finish('armed_escape');return;}
      if(outcome.kind==='door_open'){
        sound.beep('start');setBusy(false);field.focus();return;
      }
      if(outcome.kind==='win'){
        sound.beep('message');
        finish(true);return;
      }
      if(outcome.kind==='denied')sound.beep('alert');else sound.beep('message');
      if(outcome.followUp){
        const followTimer=setTimeout(()=>{
          followUpTimers.delete(followTimer);
          if(phase!=='active')return;
          if(elapsedMs()>=Engine.LIMIT_SECONDS*1000){finish(false);return;}
          addLine(outcome.followUp,'sys');sound.beep('message');
        },Engine.MS_PER_REQUEST_MIN+Math.floor(Math.random()*(Engine.MS_PER_REQUEST_MAX-Engine.MS_PER_REQUEST_MIN+1)));
        followUpTimers.add(followTimer);
      }
      setBusy(false);field.focus();
    },Engine.MS_PER_REQUEST_MIN+Math.floor(Math.random()*(Engine.MS_PER_REQUEST_MAX-Engine.MS_PER_REQUEST_MIN+1)));
  });

  // 별도 서버 없이 전체 대화 기록을 PNG 이미지로 그린다.
  function makeTranscriptImage(){
    const width=1260,pad=56,maxTextWidth=width-pad*2;
    const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
    if(!ctx)throw Error('이미지 생성 기능을 사용할 수 없습니다.');
    canvas.width=width;ctx.font='20px "Malgun Gothic","Noto Sans KR",monospace';
    const layout=[];
    function wrap(t){
      const lines=[];
      for(const part of String(t).split('\n')){
        if(!part){lines.push('');continue;}
        let line='';
        for(const c of part){
          if(ctx.measureText(line+c).width>maxTextWidth && line){lines.push(line);line=c;}
          else line+=c;
        }
        lines.push(line);
      }
      return lines;
    }
    for(const entry of transcript){
      const textLines=wrap(entry.text);
      layout.push({entry,lines:textLines});
    }
    const lineHeight=29,rowGap=16,metaHeight=22;
    const wanted=210+layout.reduce((height,x)=>height+metaHeight+Math.max(1,x.lines.length)*lineHeight+rowGap,0)+120;
    canvas.height=Math.max(480,Math.min(30000,wanted));
    ctx.fillStyle='#060b08';ctx.fillRect(0,0,width,canvas.height);
    ctx.fillStyle='#e0ebe2';ctx.font='bold 35px "Malgun Gothic","Noto Sans KR",monospace';
    ctx.fillText('그가 오고 있습니다.',pad,75);
    ctx.fillStyle='#95a69a';ctx.font='19px "Malgun Gothic","Noto Sans KR",monospace';
    ctx.fillText('SESSION TRANSCRIPT  /  '+new Date().toLocaleString('ko-KR'),pad,116);
    ctx.fillStyle='#536858';ctx.fillRect(pad,145,width-pad*2,2);
    let y=184;
    for(const {entry,lines} of layout){
      if(y+metaHeight+lines.length*lineHeight+rowGap>canvas.height-60)break;
      const label=entry.kind==='self'?'YOU / REQUEST':entry.kind==='alert'?'INCOMING / WARNING':entry.kind==='encounter'?'ENCOUNTER':entry.kind==='failure'?'REJECTED':entry.kind==='notice'?'NOTICE':'SYSTEM / RESPONSE';
      ctx.font='15px "Consolas","Malgun Gothic",monospace';
      ctx.fillStyle='#718c7a';ctx.fillText('['+String(entry.second).padStart(3,'0')+'s]  '+label,pad,y);
      y+=metaHeight;ctx.font='20px "Malgun Gothic","Noto Sans KR",monospace';
      ctx.fillStyle=entry.kind==='self'?'#a8b6a8':entry.kind==='alert'?'#eac196':entry.kind==='encounter'?'#e0ceac':entry.kind==='failure'?'#e5a49d':entry.kind==='good'?'#bbf3c6':'#d0ded2';
      for(const line of lines){ctx.fillText(line,pad,y);y+=lineHeight;}
      y+=rowGap;
    }
    ctx.fillStyle='#516b58';ctx.fillRect(pad,canvas.height-75,width-pad*2,1);
    ctx.font='16px "Consolas","Malgun Gothic",monospace';ctx.fillStyle='#778f7d';
    ctx.fillText('LOCAL RECORD / NO NETWORK TRANSFER',pad,canvas.height-42);
    return canvas.toDataURL('image/png');
  }
  function ensureRecord(){
    if(!transcriptUrl)transcriptUrl=makeTranscriptImage();
    return transcriptUrl;
  }
  function showRecord(){
    if(!['win','loss','dead','armed_escape','disguise_escape','captured','chaos'].includes(phase))return;
    try{$('#record-image').src=ensureRecord();$('#record-overlay').classList.remove('hidden');$('#record-close').focus();}
    catch(err){console.error(err);alert('대화 기록 이미지를 생성하지 못했습니다.');}
  }
  function saveRecord(){
    if(!['win','loss','dead','armed_escape','disguise_escape','captured','chaos'].includes(phase))return;
    try{
      const link=document.createElement('a');
      link.href=ensureRecord();link.download='그가_오고_있습니다_대화기록_'+phase+'.png';
      document.body.append(link);link.click();link.remove();
    }catch(err){console.error(err);alert('대화 기록 저장에 실패했습니다.');}
  }
  $('#view-record').addEventListener('click',showRecord);
  $('#save-record').addEventListener('click',saveRecord);
  $('#record-save').addEventListener('click',saveRecord);
  $('#record-close').addEventListener('click',()=>{$('#record-overlay').classList.add('hidden');$('#view-record').focus();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#record-overlay').classList.contains('hidden'))$('#record-close').click();});

  field.addEventListener('focus',syncVisibleViewport);
  $('#start').addEventListener('click',begin);$('#restart').addEventListener('click',reset);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
  window.addEventListener('pagehide',()=>{sound.stop();});
  // 게임 상태를 브라우저 개발자 도구에서만 확인 가능한 제한된 테스트 인터페이스.
  window.__gameTest = Object.freeze({state:()=>phase,elapsed:()=>phase==='active'?elapsedMs():0,inventory:()=>({...inventory}),transcript:()=>transcript.slice(),encounter:()=>activeEncounter,doorOpen:()=>doorOpen,chaos:()=>chaosSequence,statistics:()=>({...statistics}),record:()=>ensureRecord()});
})();

</script>
