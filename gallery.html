<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>연명 강령 — 장면 도감</title><style>
:root{color-scheme:dark;--bg:#050505;--panel:#0c0c0c;--line:#555;--line2:#999;--text:#eee;--muted:#aaa}*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,'Malgun Gothic',sans-serif}
a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:1px solid var(--line)}button:hover,button:focus-visible,a:focus-visible{border-color:white;outline:1px solid #ddd;outline-offset:2px}
.site{max-width:1440px;margin:auto;padding:0 22px 40px}.bar{min-height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #aaa;gap:16px;flex-wrap:wrap}
.brand{font:700 25px/1.2 Georgia,'Noto Serif KR',serif;letter-spacing:.12em}.tag{font-size:10px;color:var(--muted);letter-spacing:.18em}.back{display:inline-block;padding:9px 16px;border:1px solid #777;font-size:13px}
.head{display:flex;align-items:end;justify-content:space-between;gap:15px;padding:24px 0 18px}.head h1{font-size:26px;letter-spacing:.08em;margin:4px 0 0}.head p{margin:6px 0;color:#aaa;font-size:12px}
.filter{border-bottom:1px solid #555;display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding-bottom:18px}.filter button{padding:10px 20px}.filter button[aria-pressed=true]{background:#eee;color:#050505;border-color:white}.filter input{margin-left:auto;min-width:160px;max-width:290px;flex:1;background:#0a0a0a;border:1px solid #666;color:#eee;padding:10px 13px;outline:none}.filter input:focus{border-color:white}

.viewer{position:sticky;top:12px;align-self:start;border:1px solid #999;background:#080808;padding:15px}.viewer-meta{display:flex;justify-content:space-between;color:#aaa;font-size:10px;letter-spacing:.12em;border-bottom:1px solid #444;padding-bottom:11px}.viewer figure{margin:13px 0 8px;min-height:260px;display:grid;place-items:center;background:#020202}.viewer img{display:block;max-width:100%;max-height:380px;image-rendering:pixelated;object-fit:contain}.viewer h2{font-size:21px;font-weight:550;margin:13px 0 7px}.viewer p{font-size:12px;color:#aaa;line-height:1.7;white-space:pre-line}.count{margin:8px 0 0;font-size:11px;color:#aaa}.viewer-actions{display:flex;gap:9px;margin-top:12px}.viewer-actions button{padding:9px 12px;flex:1}.empty{padding:30px;color:#999}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:20;display:grid;place-items:center;padding:24px}.zoom[hidden]{display:none}.zoom-frame{max-width:min(96vw,1100px);max-height:96vh;display:grid;gap:12px;justify-items:center}.zoom img{max-width:100%;max-height:80vh;image-rendering:pixelated;object-fit:contain}.zoom button{border:1px solid #aaa;padding:8px 35px}.zoom .name{color:#eee;font-size:14px}
@media(max-width:850px){.grid-layout{grid-template-columns:1fr}.viewer{position:relative;top:0;order:-1}.collection{max-height:none}.viewer figure{min-height:175px}.viewer img{max-height:260px}.site{padding:0 12px 28px}}@media(max-width:480px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.filter input{margin-left:0;max-width:none;width:100%}.head h1{font-size:21px}.brand{font-size:22px}}

const SCENES=[["room","침실","수면 · 휴식"],["meal","식탁","식사"],["desk","작업실","아르바이트"],["monitor","조사 화면","인터넷 조사"],["ritual","강령진","강령 · 정화"],["street","거리","산책 · 이동"],["park","공원","산책"],["city","도시","밤의 풍경"],["terminal","터미널","외부 장소"],["ghost","원본 유령 초상","원본 이미지"]];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
let category='ghost',selected='',query='';
const entries=()=>category==='ghost'?GHOSTS.map(g=>({id:'portrait_'+g.id,name:g.name,detail:g.story||g.desc||'',tag:g.id,kind:'ghost'})):SCENES.map(([id,name,detail])=>({id,name,detail,tag:id,kind:'scene'}));
const filtered=()=>entries().filter(x=>(x.name+' '+x.tag+' '+x.detail).toLowerCase().includes(query.toLowerCase()));
function render(){const items=filtered();$('total').textContent=`${items.length}개 / ${entries().length}개`;
if(!items.find(x=>x.id===selected))selected=items[0]?.id||'';
$('items').innerHTML=items.map(x=>`<button type="button" class="item ${x.kind==='scene'?'scene':''} ${x.id===selected?'active':''}" data-select="${esc(x.id)}" aria-label="${esc(x.name)} 선택" aria-pressed="${x.id===selected}"><img alt="" src="${ART[x.id]||''}" loading="lazy"><strong>${esc(x.name)}</strong><small>${esc(x.tag)}</small></button>`).join('')||'<div class="empty">검색 결과가 없습니다.</div>';
const current=items.find(x=>x.id===selected);
$('preview').src=current?ART[current.id]:'';$('preview').alt=current?current.name+' 이미지':'선택된 이미지 없음';$('name').textContent=current?.name||'선택되지 않음';$('detail').textContent=current?.detail||'';$('meta').textContent=current?.kind==='ghost'?'유령 초상화':'장면 컷신';$('enlarge').disabled=!current;$('previous').disabled=items.length<2;$('next').disabled=items.length<2;
}
function step(delta){const items=filtered();if(!items.length)return;const idx=Math.max(0,items.findIndex(x=>x.id===selected));selected=items[(idx+delta+items.length)%items.length].id;render();}
function zoom(){if(!selected)return;$('zoomImg').src=ART[selected];$('zoomName').textContent=filtered().find(x=>x.id===selected)?.name||'';$('zoom').hidden=false;$('zoomClose').focus();}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;
if(button.dataset.select){selected=button.dataset.select;render();return;}
if(button.dataset.category){category=button.dataset.category;selected='';document.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===category)));render();return;}
if(button.id==='previous')step(-1);if(button.id==='next')step(1);if(button.id==='enlarge')zoom();if(button.id==='zoomClose')$('zoom').hidden=true;
});
$('search').addEventListener('input',e=>{query=e.target.value;render();});
$('zoom').addEventListener('click',e=>{if(e.target===$('zoom'))$('zoom').hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('zoom').hidden=true;else if(!$('zoom').hidden)return;else if(e.target.tagName==='INPUT')return;else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);});
render();
</script></body></html>
